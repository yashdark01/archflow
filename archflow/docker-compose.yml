services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: archflow
      POSTGRES_PASSWORD: archflow
      POSTGRES_DB: archflow
    ports:
      - "5432:5432"
    volumes:
      - archflow_pg_data:/var/lib/postgresql/data

volumes:
  archflow_pg_data:
